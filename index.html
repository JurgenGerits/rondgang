<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gebouwen">
<meta name="theme-color" content="#1F4E79">
<title>Rondgang &amp; conditiestaat</title>
<style>
/* Gebouwen-app: rondgang (preventie) en conditiestaat (projectopvolging) — gsm eerst; één kolom, grote knoppen, duim onderaan */
:root{ --blauw:#1F4E79; --blauw-d:#163A5B; --acc:#0584AC; --oranje:#E87722; --rood:#C62828; --groen:#2E7D32;
  --bg:#F2F5F8; --kaart:#FFFFFF; --tekst:#1E2A36; --zacht:#5F6B76; --lijn:#E1E6EC; --veld:#F7F9FB; }
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{ font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--tekst); }
.kop{ position:sticky; top:0; z-index:5; background:var(--blauw); color:#fff; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px; display:flex; align-items:center; gap:12px; }
.kop h1{ font-size:18px; font-weight:700; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kop small{ display:block; font-size:12px; font-weight:400; opacity:.75; }
.kop button{ background:rgba(255,255,255,.14); border:0; color:#fff; border-radius:10px; padding:8px 12px; font:600 15px inherit; font-family:inherit; }
main{ padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 110px); max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
.kaart{ background:var(--kaart); border-radius:14px; padding:14px 16px; box-shadow:0 1px 3px rgba(16,24,40,.07); }
.rij{ display:flex; gap:10px; align-items:center; }
label.lbl{ display:block; font-size:13px; font-weight:700; color:var(--zacht); margin:0 0 6px; }
input[type=text], input[type=date], textarea{ width:100%; font:16px inherit; font-family:inherit; color:var(--tekst); background:var(--veld); border:1px solid var(--lijn); border-radius:10px; padding:11px 12px; }
textarea{ min-height:92px; resize:vertical; }
input:focus, textarea:focus{ outline:2px solid var(--acc); outline-offset:0; background:#fff; }
.velden{ display:flex; flex-direction:column; gap:12px; }
.knop{ display:flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:12px; padding:14px 16px; font:700 16px inherit; font-family:inherit; width:100%; cursor:pointer; }
.knop.hoofd{ background:var(--oranje); color:#fff; }
.knop.blauw{ background:var(--blauw); color:#fff; }
.knop.licht{ background:#fff; color:var(--blauw); border:1px solid var(--lijn); }
.knop:disabled{ opacity:.45; }
.onder{ position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px); background:linear-gradient(to top, var(--bg) 70%, rgba(242,245,248,0)); z-index:4; }
.onder .binnen{ max-width:640px; margin:0 auto; display:flex; gap:10px; }
.rg-it{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--kaart); border:0; border-radius:14px; padding:14px 16px; box-shadow:0 1px 3px rgba(16,24,40,.07); font:inherit; color:inherit; }
.rg-it b{ display:block; font-size:16px; } .rg-it span{ color:var(--zacht); font-size:13px; }
.pil{ display:inline-block; border-radius:20px; padding:3px 10px; font-size:12px; font-weight:700; white-space:nowrap; }
.pil.bezig{ background:#FDEFE3; color:#B4570F; } .pil.weg{ background:#E6F4EA; color:#1E6B32; }
.pil.Hoog{ background:#FBE9E9; color:#A32020; } .pil.Midden{ background:#FDEFE3; color:#B4570F; } .pil.Laag{ background:#E7F0F9; color:#2B5F94; }
.pil.opm{ background:#EEF1F4; color:var(--zacht); }
.punt{ display:flex; gap:12px; }
.punt .dm{ width:76px; height:76px; border-radius:10px; object-fit:cover; flex:none; background:#DDE3EA; }
.punt .tx{ flex:1; min-width:0; } .punt .tx p{ font-size:15px; overflow-wrap:anywhere; } .punt .tx small{ color:var(--zacht); font-size:13px; display:block; margin-top:2px; }
.punt .nr{ font-size:12px; color:var(--zacht); font-weight:700; }
.punt-k{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center; }
.mini{ background:none; border:0; color:var(--acc); font:600 14px inherit; font-family:inherit; padding:4px 2px; }
.mini.weg{ color:var(--rood); }
.fotos{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.fotos div{ position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#DDE3EA; }
.fotos img{ width:100%; height:100%; object-fit:cover; display:block; }
.fotos button{ position:absolute; top:4px; right:4px; width:28px; height:28px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:16px; line-height:1; }
.fotoknop{ display:flex; gap:8px; }
.fotoknop label{ flex:1; }
.seg{ display:flex; background:var(--veld); border:1px solid var(--lijn); border-radius:12px; padding:3px; gap:3px; }
.seg button{ flex:1; border:0; background:none; border-radius:9px; padding:10px 6px; font:600 14px inherit; font-family:inherit; color:var(--zacht); }
.seg button.aan{ background:#fff; color:var(--blauw); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.seg.prio button.aan[data-v=Hoog]{ color:var(--rood); } .seg.prio button.aan[data-v=Midden]{ color:#B4570F; }
.leeg{ text-align:center; color:var(--zacht); padding:26px 10px; }
.uitleg{ font-size:13px; color:var(--zacht); }
.melding{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 96px); transform:translateX(-50%); background:#1E2A36; color:#fff; padding:11px 16px; border-radius:10px; font-size:14px; z-index:9; max-width:90vw; text-align:center; }
.vk{ font-size:13px; color:var(--zacht); }
[hidden]{ display:none !important; }
/* checklist (versie 2) */
.cl-kop{ display:flex; align-items:baseline; gap:8px; } .cl-kop b{ flex:1; } .cl-tel{ font-size:13px; color:var(--zacht); white-space:nowrap; }
.cl-cat{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--blauw); margin:14px 0 4px; }
.cl-it{ border-top:1px solid var(--lijn); padding:10px 0; }
.cl-it p{ font-size:15px; margin-bottom:8px; }
.cl-k{ display:flex; gap:6px; }
.cl-k button{ flex:1; border:1px solid var(--lijn); background:#fff; border-radius:10px; padding:10px 4px; font:600 14px inherit; font-family:inherit; color:var(--zacht); }
.cl-k button.foto{ flex:0 0 42px; font-size:17px; padding:10px 0; }
.cl-k button.aan.ok{ background:var(--groen); border-color:var(--groen); color:#fff; } .cl-k button.aan.nok{ background:var(--rood); border-color:var(--rood); color:#fff; } .cl-k button.aan.nvt{ background:#8A94A0; border-color:#8A94A0; color:#fff; }
.cl-it.nok{ background:#FFF6F5; margin:0 -16px; padding:10px 16px; }
.cl-extra{ display:flex; flex-direction:column; gap:8px; margin-top:8px; } .cl-extra textarea{ min-height:64px; }
.cl-fotos{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; } .cl-fotos div{ position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; } .cl-fotos img{ width:100%; height:100%; object-fit:cover; }
.cl-fotos button{ position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:13px; line-height:1; }
.bevestig{ position:fixed; inset:0; background:rgba(16,24,40,.45); z-index:8; display:flex; align-items:flex-end; }
.bevestig .kaart{ width:100%; border-radius:16px 16px 0 0; padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px); display:flex; flex-direction:column; gap:10px; }
/* startscherm en conditiestaat */
.tegel{ display:flex; gap:14px; align-items:center; width:100%; text-align:left; background:var(--kaart); border:0; border-radius:16px; padding:18px 16px; box-shadow:0 1px 3px rgba(16,24,40,.08); font:inherit; color:inherit; }
.tegel-ic{ font-size:34px; width:56px; height:56px; display:grid; place-items:center; background:#EAF1F8; border-radius:14px; flex:none; }
.tegel-tx{ flex:1; min-width:0; } .tegel-tx b{ display:block; font-size:18px; color:var(--blauw); } .tegel-tx span{ color:var(--zacht); font-size:13px; }
select.sel{ width:100%; font:16px inherit; font-family:inherit; padding:11px 12px; border:1px solid var(--lijn); border-radius:10px; background:var(--veld); color:var(--tekst); }
.c-voortgang{ display:flex; justify-content:space-between; gap:8px; font-size:14px; } .c-voortgang span{ color:var(--zacht); }
.c-balk{ height:8px; background:#E6EBF0; border-radius:4px; overflow:hidden; margin-top:8px; } .c-balk i{ display:block; height:100%; background:var(--groen); transition:width .3s; }
.c-bol{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; color:#fff; font-size:12px; font-weight:800; flex:none; }
.c-bol.leeg{ background:#fff; border:2px dashed #C3CCD6; } .c-bol.nvt{ background:#B9C4CF; }
.c-groep{ padding:0; overflow:hidden; } .c-groep summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:14px 16px; font-size:16px; cursor:pointer; }
.c-groep summary::-webkit-details-marker{ display:none; } .c-groep summary b{ flex:1; } .c-groep summary::after{ content:"\203A"; font-size:22px; color:var(--zacht); transition:transform .2s; } .c-groep[open] summary::after{ transform:rotate(90deg); }
.c-gtel{ font-size:13px; color:var(--zacht); font-weight:700; white-space:nowrap; } .c-gtel.ok{ color:var(--groen); }
.c-deel{ border-top:1px solid var(--lijn); padding:12px 16px; } .c-deel.gb{ background:#FFF8F2; }
.c-dkop{ display:flex; align-items:center; gap:10px; margin-bottom:8px; } .c-dnaam{ font-weight:600; font-size:15px; }
.c-k{ display:flex; gap:6px; } .c-k button{ flex:1; border:1px solid var(--lijn); background:#fff; border-radius:10px; padding:10px 4px; font:600 13px inherit; font-family:inherit; color:var(--zacht); }
.c-k button.gb{ color:var(--oranje); border-color:#F3C9A5; } .c-k button.foto{ flex:0 0 40px; font-size:16px; padding:10px 0; } .c-k button:disabled{ opacity:.35; }
.c-k button.aan.ok{ background:var(--groen); border-color:var(--groen); color:#fff; } .c-k button.aan.nvt{ background:#8A94A0; border-color:#8A94A0; color:#fff; }
.c-gb{ display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:#fff; border:1px solid #F1D9C4; border-radius:10px; padding:8px 10px; margin-top:8px; font:inherit; color:inherit; }
.c-gb b{ display:block; font-size:14px; } .c-gb small{ display:block; color:var(--zacht); font-size:12px; }
.c-rest{ margin:4px 16px 14px; width:calc(100% - 32px); font-size:14px; padding:11px; }
.c-seg button{ font-size:13px; padding:10px 2px; }
.c-score{ display:flex; align-items:center; gap:10px; background:var(--veld); border-radius:10px; padding:10px 12px; } .c-score .c-bol{ width:34px; height:34px; font-size:16px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; } .chips button{ border:1px solid var(--lijn); background:#fff; border-radius:20px; padding:8px 12px; font:600 13px inherit; font-family:inherit; color:var(--zacht); }
.chips button.aan{ background:var(--blauw); border-color:var(--blauw); color:#fff; }
.c-adres{ display:flex; align-items:center; gap:10px; background:var(--veld); border-radius:10px; padding:10px 12px; } .c-adres b{ flex:1; overflow-wrap:anywhere; } .c-adres .knop{ width:auto; padding:8px 12px; font-size:14px; }
</style>
</head>
<body>
<div class="kop"><button id="terug" hidden>&#8249; Terug</button><h1 id="titel">Gebouwen<small id="sub">Houthalen-Helchteren</small></h1><button id="instelKnop">&#9881;</button></div>
<main id="scherm"></main>
<div class="onder" id="onder"><div class="binnen" id="onderBinnen"></div></div>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<input type="file" id="bib" accept="image/*" multiple hidden>
<script>
"use strict";
const MAX = 1600, KWAL = 0.72;
let staat = {scherm:"start", rid:null, pid:null}, lijst = [], db = null, concept = null;
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vandaag = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dNL = iso => iso ? iso.split("-").reverse().join("/") : "";
const nieuwId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const slug = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "gebouw";
function melding(t, ms){ const m = document.createElement("div"); m.className = "melding"; m.textContent = t; document.body.appendChild(m); setTimeout(()=>m.remove(), ms||2400); }
function ls(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

/* --- opslag op de gsm (IndexedDB; foto's als blob) --- */
function dbOpen(){ return new Promise(res=>{ try{ const r = indexedDB.open("rondgang-app", 2); r.onupgradeneeded = ()=>{ const d = r.result; if(!d.objectStoreNames.contains("rg")) d.createObjectStore("rg", {keyPath:"id"}); if(!d.objectStoreNames.contains("cm")) d.createObjectStore("cm", {keyPath:"id"}); }; r.onsuccess = ()=>res(r.result); r.onerror = ()=>res(null); }catch(e){ res(null); } }); }
function dbAlles(){ return new Promise(res=>{ if(!db) return res(lijst); try{ const q = db.transaction("rg").objectStore("rg").getAll(); q.onsuccess = ()=>res(q.result||[]); q.onerror = ()=>res([]); }catch(e){ res([]); } }); }
function dbZet(r){ return new Promise(res=>{ if(!db) return res(); try{ const t = db.transaction("rg","readwrite"); t.objectStore("rg").put(r); t.oncomplete = ()=>res(); t.onerror = ()=>{ melding("Bewaren op de gsm lukte niet (geheugen vol?)."); res(); }; }catch(e){ res(); } }); }
function dbWeg(id){ return new Promise(res=>{ if(!db) return res(); try{ const t = db.transaction("rg","readwrite"); t.objectStore("rg").delete(id); t.oncomplete = ()=>res(); t.onerror = ()=>res(); }catch(e){ res(); } }); }
async function bewaar(r){ r.gewijzigd = new Date().toISOString(); const i = lijst.findIndex(x=>x.id===r.id); if(i<0) lijst.push(r); else lijst[i] = r; await dbZet(r); }

/* --- gebouwenlijst: komt mee in de link uit het programma (#g=…), wordt op de gsm onthouden ---
   De lijst blijft in het adres staan: een app op het beginscherm van de iPhone heeft een eigen geheugen, los van Safari,
   en leest de lijst zo bij elke start opnieuw uit haar eigen adres. (Het deel na # wordt nooit naar de server gestuurd.) */
function leesLink(){ const h = location.hash; if(h.startsWith("#g=")) laadGebouwenUit(h, true); else if(h.startsWith("#c=")) laadConditieUit(h, true); }
// leest de gebouwenlijst uit een link of uit geplakte tekst die "#g=…" bevat; geeft true terug als het lukte
function laadGebouwenUit(tekst, stil){
  if(/#c=/.test(String(tekst||"")) && !/#g=/.test(String(tekst||""))) return laadConditieUit(tekst, stil);
  const m = String(tekst||"").match(/#g=([A-Za-z0-9_\-]+)/); if(!m){ if(!stil) melding("In deze tekst staat geen gebouwenlijst. Kopieer de volledige link uit de mail.", 4000); return false; }
  try{ const s = atob(m[1].replace(/-/g,"+").replace(/_/g,"/")); const b = new Uint8Array([...s].map(c=>c.charCodeAt(0))); const j = JSON.parse(new TextDecoder().decode(b));
    if(!Array.isArray(j.g)) throw new Error("geen lijst");
    const c = Array.isArray(j.c) ? j.c : (ls("rg-checklists")||[]);
    const nieuw = JSON.stringify(j.g)!==JSON.stringify(ls("rg-gebouwen")||null) || JSON.stringify(c)!==JSON.stringify(ls("rg-checklists")||null);
    ls("rg-gebouwen", j.g); ls("rg-checklists", c); if(j.n && !ls("rg-naam")) ls("rg-naam", j.n);
    if(nieuw || !stil) melding(`${j.g.length} gebouwen${c.length?` en ${c.length} checklist${c.length===1?"":"s"}`:""} ingeladen.`); return true;
  }catch(e){ melding("De gebouwenlijst in deze link kon niet gelezen worden."); return false; } }
function inlaadKaart(){
  return `<div class="kaart velden"><label class="lbl" for="i-link">Link uit het programma inladen</label>
    <p class="uitleg">Kopieer in de mail uit het preventieprogramma (rondgang) of uit projectopvolging (conditiestaat) de link: lang drukken op de link → Kopieer. Plak ze hieronder.</p>
    <textarea id="i-link" rows="3" placeholder="plak hier de link"></textarea>
    <div style="display:flex; gap:8px; margin-top:8px"><button class="knop" id="i-plak">Plakken</button><button class="knop hoofd" id="i-laad">Inladen</button></div></div>`;
}
function inlaadKoppel(){
  const t = $("#i-link"); if(!t) return;
  $("#i-plak").onclick = async ()=>{ try{ t.value = await navigator.clipboard.readText(); }catch(e){ melding("Plakken lukte niet; houd je vinger in het vak en kies Plak.", 4000); } };
  $("#i-laad").onclick = ()=>{ if(laadGebouwenUit(t.value)){ if(staat.scherm==="start" || staat.scherm==="lijst" || staat.scherm==="cLijst") staat = {scherm:"start"}; toon(); } };
}
const gebouwen = () => ls("rg-gebouwen") || [];
const checklists = () => ls("rg-checklists") || [];   // [[id, naam, [[itemId, categorie, tekst], …]], …]
const clVan = r => checklists().find(c=>c[0]===r.checklistId) || null;
const gebouwId = naam => (gebouwen().find(g=>g[1].toLowerCase()===String(naam||"").trim().toLowerCase())||[])[0] || "";

/* --- foto verkleinen --- */
function verklein(file){ return new Promise(res=>{ const url = URL.createObjectURL(file), img = new Image();
  img.onload = ()=>{ const s = Math.min(1, MAX/Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b=>res(b), "image/jpeg", KWAL); };
  img.onerror = ()=>{ URL.revokeObjectURL(url); res(null); }; img.src = url; }); }
const urls = new Map(); function fotoUrl(b){ if(!urls.has(b)) urls.set(b, URL.createObjectURL(b)); return urls.get(b); }

/* --- schermen --- */
function kop(titel, sub, terug){ $("#titel").innerHTML = `${esc(titel)}<small>${esc(sub||"")}</small>`; $("#terug").hidden = !terug; }
function onder(html){ $("#onderBinnen").innerHTML = html; $("#onder").hidden = !html; }
function toon(){ window.scrollTo(0,0); if(staat.scherm==="start" && !beide()) staat = {scherm: heeftC() ? "cLijst" : heeftR() ? "lijst" : "start"};
  ({start:schermStart, lijst:schermLijst, rg:schermRondgang, punt:schermPunt, instel:schermInstel, cLijst:schermCLijst, cMeting:schermCMeting, cGebrek:schermCGebrek})[staat.scherm](); }
const huidig = () => lijst.find(r=>r.id===staat.rid);

function schermLijst(){
  kop("Rondgangen", "Preventie Houthalen-Helchteren", beide());
  const l = lijst.slice().sort((a,b)=>(b.gewijzigd||"").localeCompare(a.gewijzigd||""));
  $("#scherm").innerHTML = (l.length ? l.map(r=>`<button class="rg-it" data-id="${r.id}"><div style="flex:1; min-width:0"><b>${esc(r.gebouw||"Gebouw nog te kiezen")}</b><span>${dNL(r.datum)} · ${r.punten.length} punt${r.punten.length===1?"":"en"} · ${r.punten.reduce((n,p)=>n+p.fotos.length,0)} foto's</span></div>
      <span class="pil ${r.verzonden?"weg":"bezig"}">${r.verzonden?"verzonden":"bezig"}</span></button>`).join("")
    : `<div class="kaart leeg"><p><b>Nog geen rondgang op deze gsm.</b></p><p class="uitleg" style="margin-top:6px">Start een rondgang, neem per vaststelling een foto en schrijf er kort bij wat je ziet. Op het einde verstuur je alles in één mail naar het preventieprogramma.</p></div>`)
    + (gebouwen().length || heeftC() ? "" : inlaadKaart());
  document.querySelectorAll(".rg-it").forEach(b=>b.onclick = ()=>{ staat = {scherm:"rg", rid:b.dataset.id}; toon(); });
  inlaadKoppel();
  onder(`<button class="knop hoofd" id="nieuw">+ Nieuwe rondgang</button>`);
  $("#nieuw").onclick = async ()=>{ const r = {id:nieuwId(), gebouw:"", datum:vandaag(), deelnemers:ls("rg-naam")||"", algemeen:"", punten:[], verzonden:""}; await bewaar(r); staat = {scherm:"rg", rid:r.id}; toon(); setTimeout(()=>$("#f-geb")?.focus(), 100); };
}

function schermRondgang(){
  const r = huidig(); if(!r){ staat = {scherm:"lijst"}; return toon(); }
  kop(r.gebouw || "Nieuwe rondgang", dNL(r.datum)+(r.verzonden?" · verzonden":""), true);
  $("#scherm").innerHTML = `<div class="kaart velden">

let clFotoDoel = null;
function clAntw(r, iid){ r.checklist = r.checklist||{}; return r.checklist[iid] = r.checklist[iid]||{}; }

    <div class="cl-k">${[["ok","in orde"],["nok","niet in orde"],["nvt","n.v.t."]].map(([s,t])=>`<button class="${s} ${a.st===s?"aan":""}" data-st="${s}">${t}</button>`).join("")}<button class="foto" data-foto="1" aria-label="Foto nemen">&#128247;</button><button class="foto" data-bib="1" aria-label="Foto uit je bibliotheek">&#128444;</button></div>

function clItemVernieuw(r, iid){ const cl = clVan(r), i = cl && cl[2].find(x=>x[0]===iid), el = document.getElementById("ci-"+iid); if(el && i) el.outerHTML = clItemHtml(r, i); const t = $("#cl-tel"); if(t && cl) t.textContent = clTel(r, cl); $("#verzend") && ($("#verzend").disabled = !kanVerzenden(r)); }
function clKoppel(r){

async function fotosErbij(files){
  if(cFotoDoel) return cFotosErbij(files);
  if(clFotoDoel && staat.scherm==="rg"){ const r = huidig(), iid = clFotoDoel; clFotoDoel = null; if(!r) return; const l = [...(files||[])]; if(!l.length) return;

/* --- verzenden: één mail met een gegevensbestand en de foto's --- */
async function verzenden(r){
  if(!r.gebouw){ melding("Kies eerst het gebouw."); $("#f-geb").focus(); return; }
  const basis = `rondgang-${slug(r.gebouw)}-${r.datum}`, files = [], punten = [];
  r.punten.forEach((p,i)=>{ const namen = p.fotos.map((f,j)=>`${basis}-p${String(i+1).padStart(2,"0")}-${j+1}.jpg`); namen.forEach((n,j)=>files.push(new File([p.fotos[j]], n, {type:"image/jpeg"})));
    punten.push({nr:i+1, tekst:p.tekst.trim(), plaats:p.plaats.trim(), prio:p.prio, soort:p.soort, fotos:namen}); });
  const cl = clVan(r), antwoorden = {};
  if(cl) cl[2].forEach(i=>{ const a = (r.checklist||{})[i[0]]; if(!a || !a.st && !(a.fotos||[]).length) return;
    const namen = (a.fotos||[]).map((f,j)=>`${basis}-c${slug(i[0])}-${j+1}.jpg`); namen.forEach((n,j)=>files.push(new File([a.fotos[j]], n, {type:"image/jpeg"})));
    antwoorden[i[0]] = {st:a.st||"", opm:(a.opm||"").trim(), prio:a.prio||"Midden", fotos:namen}; });
  const data = {type:"preventie-rondgang", versie:2, ...(cl ? {checklist:{id:cl[0], naam:cl[1], antwoorden}} : {}), gemaakt:new Date().toISOString(), door:ls("rg-naam")||"", gebouw:{id:gebouwId(r.gebouw), naam:r.gebouw}, datum:r.datum, deelnemers:r.deelnemers, algemeen:r.algemeen.trim(), punten};
  const json = new File([JSON.stringify(data, null, 1)], basis+".json", {type:"application/json"});
  const clNok = cl ? cl[2].filter(i=>antwoorden[i[0]]?.st==="nok") : [];
  const tekst = `Rondgang ${r.gebouw} – ${dNL(r.datum)}\n${punten.length} punten, ${files.length} foto's.${cl?`\nChecklist ${cl[1]}: ${Object.values(antwoorden).filter(a=>a.st).length}/${cl[2].length} beantwoord, ${clNok.length} niet in orde${clNok.length?":\n"+clNok.map(i=>"– "+i[2]+(antwoorden[i[0]].opm?" ("+antwoorden[i[0]].opm+")":"")).join("\n"):""}.`:""}\n\n` + punten.map(p=>`${p.nr}. ${p.tekst}${p.plaats?" ("+p.plaats+")":""} – ${p.soort==="opmerking"?"opmerking":p.prio}`).join("\n") + (data.algemeen?`\n\nAlgemeen: ${data.algemeen}`:"") + `\n\nSleep deze mail in de map "Te verwerken mails" van het preventieprogramma.`;
  const alles = [json, ...files];
  try{
    if(navigator.canShare && navigator.canShare({files:alles})){ await navigator.share({files:alles, title:`Rondgang ${r.gebouw} ${dNL(r.datum)}`, text:tekst}); r.verzonden = vandaag(); await bewaar(r); toon(); melding("Verzonden. Sleep de mail op je pc in de map “Te verwerken mails”.", 4000); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  // reserve: één bestand met de foto's erin, om zelf als bijlage te versturen
  const metFotos = {...data, fotosData:{}}; for(const f of files) metFotos.fotosData[f.name] = await new Promise(res=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.readAsDataURL(f); });
  const blob = new Blob([JSON.stringify(metFotos)], {type:"application/json"}), a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = basis+".json"; document.body.appendChild(a); a.click(); a.remove();
  r.verzonden = vandaag(); await bewaar(r); toon(); melding("Delen lukt niet in deze browser. Het bestand is gedownload: stuur het als bijlage naar jezelf.", 6000);
}
function bevestig(vraag, knop, ok){ const d = document.createElement("div"); d.className = "bevestig"; d.innerHTML = `<div class="kaart"><p style="font-weight:600">${esc(vraag)}</p><button class="knop hoofd" style="background:var(--rood)">${esc(knop)}</button><button class="knop licht">Annuleren</button></div>`;
  document.body.appendChild(d); const [j, n] = d.querySelectorAll("button"); j.onclick = ()=>{ d.remove(); ok(); }; n.onclick = ()=>d.remove(); d.onclick = e=>{ if(e.target===d) d.remove(); }; }

/* ======================= Conditiestaat (projectopvolging 9.10: bouwdelen in twee niveaus, gebreken volgens NEN 2767) =======================
   De link uit projectopvolging (#c=…) brengt de gebouwen, bouwdelen, gebouwtypes, de NEN-tabel, de namen en het ontvangstadres mee.
   Een meting blijft op de gsm (IndexedDB "cm") tot ze verzonden wordt: één mail met een gegevensbestand (type "conditie-meting") en de foto's. */
let metingen = [], cConcept = null, cFotoDoel = null, cScroll = 0; const cOpen = new Set();
const NEN_STD = {"3-3":[3,4,5,6,6], "3-2":[2,3,4,5,6], "3-1":[1,2,3,4,5], "2-3":[2,3,4,5,6], "2-2":[1,2,3,4,5], "2-1":[1,1,2,3,4], "1-3":[1,2,3,4,5], "1-2":[1,1,2,3,4], "1-1":[1,1,1,2,3]};
const ERNST = ["", "gering", "serieus", "ernstig"], INTENS = ["", "begin", "gevorderd", "eind"], OMVANG = ["", "< 2 %", "2–10 %", "10–30 %", "30–70 %", "≥ 70 %"];
const ASPECTEN = [["veiligheid","Veiligheid","&#9888;"],["gezondheid","Gezondheid","&#10010;"],["gebruik","Gebruik","&#9881;"],["wetgeving","Wetgeving","&#9878;"],["instandhouding","Instandhouding","&#127970;"]];
const URGENTIE = [["nu","Nu",0],["1j","1 jaar",1],["5j","1–5 jaar",3],["later","Later",null]];
const GEBREK_STD = ["Lekkage","Scheurvorming","Corrosie / roest","Rot / houtaantasting","Vocht / schimmel","Afbladderende verf","Beschadiging","Loszittend / instabiel","Slijtage","Vervuiling / verstopping","Ontbrekende onderdelen","Werkt niet / defect","Verouderd / einde levensduur","Niet conform regelgeving"];
const C_LABEL = ["", "uitstekend", "goed", "redelijk", "matig", "slecht", "zeer slecht"], C_KLEUR = ["#9AA4AE", "#2E7D32", "#7CB342", "#F9A825", "#FB8C00", "#E53935", "#8E1B1B"];
function linkJson(b64){ const s = atob(b64.replace(/-/g,"+").replace(/_/g,"/")); return JSON.parse(new TextDecoder().decode(new Uint8Array([...s].map(c=>c.charCodeAt(0))))); }
function laadConditieUit(tekst, stil){
  const m = String(tekst||"").match(/#c=([A-Za-z0-9_\-]+)/); if(!m){ if(!stil) melding("In deze tekst staan geen gegevens voor de conditiestaat. Kopieer de volledige link uit de mail.", 4000); return false; }
  try{ const j = linkJson(m[1]); if(!Array.isArray(j.g) || !Array.isArray(j.d)) throw new Error("onvolledig");
    const nieuw = JSON.stringify(j)!==JSON.stringify(ls("cm-data")||null); ls("cm-data", j);
    if(nieuw || !stil) melding(`${j.g.length} gebouwen en ${j.d.length} bouwdelen ingeladen.`); return true;
  }catch(e){ melding("De gegevens in deze link konden niet gelezen worden."); return false; } }
const cData = () => ls("cm-data");
const cGeb = id => (cData()?.g||[]).find(g=>g[0]===id);
const cDeel = id => (cData()?.d||[]).find(d=>d[0]===id);
const cGroepVan = id => cDeel(id)?.[2] || "overig";
const cGroepNaam = id => ((cData()?.gr||[]).find(g=>g[0]===id)||[])[1] || "Overige";
function cDelenVoorGebouw(gid){ const d = cData(), g = cGeb(gid), t = g && g[2] ? (d.t||[]).find(x=>x[0]===g[2]) : null; return (d.d||[]).filter(x=>!t || (t[2]||[]).includes(x[0])).map(x=>x[0]); }
function cNen(g){ const t = cData()?.nen || NEN_STD, r = t[`${g.ernst}-${g.intensiteit}`] || NEN_STD[`${g.ernst}-${g.intensiteit}`]; return r ? r[(Number(g.omvang)||1)-1] : null; }
function cScore(x){ if(!x || x.nvt) return 0; const l = (x.gebreken||[]).map(cNen).filter(Boolean); return l.length ? Math.max(...l) : (x.score||0); }
const cKlaar = x => !!x && !!(x.nvt || (x.gebreken||[]).length || x.score);
function cTel(m){ const ids = m.deelIds||[], d = m.delen||{}; return {n:ids.length, b:ids.filter(id=>cKlaar(d[id])).length, g:ids.reduce((s,id)=>s+(d[id]?.gebreken||[]).length, 0), f:ids.reduce((s,id)=>s+(d[id]?.fotos||[]).length, 0)}; }
const cBol = s => s ? `<span class="c-bol" style="background:${C_KLEUR[s]}" title="${C_LABEL[s]}">${s}</span>` : `<span class="c-bol leeg"></span>`;
const cUrgJaar = u => { const x = URGENTIE.find(y=>y[0]===u); return x && x[2]!==null ? new Date().getFullYear() + x[2] : ""; };
const cHuidig = () => metingen.find(m=>m.id===staat.mid);

/* --- opslag op de gsm --- */
function cStore(mode){ return db && db.objectStoreNames.contains("cm") ? db.transaction("cm", mode||"readonly").objectStore("cm") : null; }
function cDbAlles(){ return new Promise(res=>{ try{ const st = cStore(); if(!st) return res([]); const q = st.getAll(); q.onsuccess = ()=>res(q.result||[]); q.onerror = ()=>res([]); }catch(e){ res([]); } }); }
function cDbZet(m){ return new Promise(res=>{ if(!db) return res(); try{ const t = db.transaction("cm","readwrite"); t.objectStore("cm").put(m); t.oncomplete = ()=>res(); t.onerror = ()=>{ melding("Bewaren op de gsm lukte niet (geheugen vol?)."); res(); }; }catch(e){ res(); } }); }
function cDbWeg(id){ return new Promise(res=>{ if(!db) return res(); try{ const t = db.transaction("cm","readwrite"); t.objectStore("cm").delete(id); t.oncomplete = ()=>res(); t.onerror = ()=>res(); }catch(e){ res(); } }); }
async function cBewaar(m){ m.gewijzigd = new Date().toISOString(); const i = metingen.findIndex(x=>x.id===m.id); if(i<0) metingen.push(m); else metingen[i] = m; await cDbZet(m); }

/* --- lijst van metingen --- */
function schermCLijst(){
  kop("Conditiestaat", "Projectopvolging Team Gebouwen", beide());
  const l = metingen.slice().sort((a,b)=>(b.gewijzigd||"").localeCompare(a.gewijzigd||""));
  $("#scherm").innerHTML = (l.length ? l.map(m=>{ const t = cTel(m); return `<button class="rg-it" data-id="${m.id}"><div style="flex:1; min-width:0"><b>${esc(m.gebouw||"Gebouw nog te kiezen")}</b>
      <span>${dNL(m.datum)} · ${t.b}/${t.n} bouwdelen · ${t.g} gebrek${t.g===1?"":"en"} · ${t.f} foto${t.f===1?"":"'s"}</span></div><span class="pil ${m.verzonden?"weg":"bezig"}">${m.verzonden?"verzonden":"bezig"}</span></button>`; }).join("")
    : `<div class="kaart leeg"><p><b>Nog geen meting op deze gsm.</b></p><p class="uitleg" style="margin-top:6px">Start een meting, kies het gebouw en loop de bouwdelen af: geen gebreken, n.v.t. of een gebrek met foto. Op het einde verstuur je alles in één mail naar projectopvolging.</p></div>`)
    + (heeftC() ? "" : inlaadKaart());
  document.querySelectorAll(".rg-it").forEach(b=>b.onclick = ()=>{ cOpen.clear(); staat = {scherm:"cMeting", mid:b.dataset.id}; toon(); });
  inlaadKoppel();
  onder(heeftC() ? `<button class="knop hoofd" id="cNieuw">+ Nieuwe meting</button>` : "");
  if($("#cNieuw")) $("#cNieuw").onclick = async ()=>{ const m = {id:nieuwId(), gebouwId:"", gebouw:"", datum:vandaag(), door:ls("rg-naam")||"", opmerking:"", deelIds:[], delen:{}, verzonden:""};
    await cBewaar(m); cOpen.clear(); staat = {scherm:"cMeting", mid:m.id}; toon(); };
}

/* --- de meting: per hoofdgroep de bouwdelen; tikken vernieuwt enkel die groep, het scherm verspringt niet --- */
function cGroepen(m){ const o = (cData()?.gr||[]).map(g=>g[0]), l = [...new Set((m.deelIds||[]).map(cGroepVan))]; return l.sort((a,b)=>(o.indexOf(a)<0?999:o.indexOf(a)) - (o.indexOf(b)<0?999:o.indexOf(b))); }
function cDeelHtml(m, id){
  const x = (m.delen||{})[id] || {}, gb = x.gebreken||[], f = x.fotos||[], st = x.nvt ? "nvt" : gb.length ? "gb" : x.score ? "ok" : "";
  return `<div class="c-deel ${st}" data-d="${esc(id)}"><div class="c-dkop">${st==="nvt" ? `<span class="c-bol nvt">&ndash;</span>` : cBol(cScore(x))}<span class="c-dnaam">${esc(cDeel(id)?.[1]||x.naam||id)}</span></div>
    <div class="c-k"><button data-act="geen" class="${st==="ok"?"aan ok":""}" ${gb.length?"disabled":""}>&#10004; geen gebreken</button><button data-act="nvt" class="${st==="nvt"?"aan nvt":""}" ${gb.length?"disabled":""}>n.v.t.</button><button data-act="gebrek" class="gb">+ gebrek</button><button data-act="foto" class="foto" aria-label="Foto nemen">&#128247;</button><button data-act="bib" class="foto" aria-label="Foto uit je bibliotheek">&#128444;</button></div>
    ${gb.map(g=>`<button class="c-gb" data-act="gb" data-gb="${esc(g.id)}">${cBol(cNen(g))}<span><b>${esc(g.gebrek)}</b><small>${ERNST[g.ernst]} · ${INTENS[g.intensiteit]} · ${OMVANG[g.omvang]} · ${(URGENTIE.find(u=>u[0]===g.urgentie)||[])[1]||""}${Number(g.kosten)?` · € ${Number(g.kosten).toLocaleString("nl-BE")}`:""} ${(g.aspecten||[]).map(a=>(ASPECTEN.find(z=>z[0]===a)||[])[2]).join("")}</small></span></button>`).join("")}
    ${f.length ? `<div class="cl-fotos">${f.map((b,j)=>`<div><img src="${fotoUrl(b)}" alt=""><button data-act="fw" data-j="${j}" aria-label="Foto verwijderen">&times;</button></div>`).join("")}</div>` : ""}</div>`;
}
function cGroepHtml(m, gid){
  const ids = (m.deelIds||[]).filter(id=>cGroepVan(id)===gid), sc = ids.map(id=>cScore((m.delen||{})[id])).filter(Boolean), klaar = ids.filter(id=>cKlaar((m.delen||{})[id])).length;
  return `<details class="kaart c-groep" data-g="${esc(gid)}" ${cOpen.has(gid)?"open":""}><summary>${cBol(sc.length?Math.max(...sc):0)}<b>${esc(cGroepNaam(gid))}</b><span class="c-gtel ${klaar===ids.length?"ok":""}">${klaar===ids.length?"&#10004; ":""}${klaar}/${ids.length}</span></summary>
    ${ids.map(id=>cDeelHtml(m, id)).join("")}
    ${klaar<ids.length ? `<button class="knop licht c-rest" data-act="rest">Rest van ${esc(cGroepNaam(gid).toLowerCase())}: geen gebreken</button>` : ""}</details>`;
}
function cTellers(m){ const t = cTel(m); if($("#c-tel")){ $("#c-tel").textContent = `${t.b}/${t.n} bouwdelen bekeken`; $("#c-tel2").textContent = `${t.g} gebrek${t.g===1?"":"en"} · ${t.f} foto${t.f===1?"":"'s"}`; $("#c-balk").style.width = (t.n ? Math.round(t.b/t.n*100) : 0)+"%"; }
  if($("#cVerzend")) $("#cVerzend").disabled = !(t.b || (m.opmerking||"").trim()); }
function cGroepVernieuw(m, gid){ const el = document.querySelector(`.c-groep[data-g="${CSS.escape(gid)}"]`); if(el){ el.outerHTML = cGroepHtml(m, gid); cToggleKoppel(); } cTellers(m); }
function cToggleKoppel(){ document.querySelectorAll(".c-groep").forEach(d=>{ if(d._k) return; d._k = 1; d.addEventListener("toggle", ()=>{ if(d.open) cOpen.add(d.dataset.g); else cOpen.delete(d.dataset.g); }); }); }
function schermCMeting(){
  const m = cHuidig(); if(!m){ staat = {scherm:"cLijst"}; return toon(); }
  const d = cData(); if(!d){ staat = {scherm:"cLijst"}; return toon(); }
  m.delen = m.delen||{}; const t = cTel(m);
  kop(m.gebouw || "Nieuwe meting", dNL(m.datum)+(m.verzonden?" · verzonden":""), true);
  $("#scherm").innerHTML = `<div class="kaart velden">
      <div><label class="lbl" for="c-geb">Gebouw</label><select id="c-geb" class="sel"><option value="">— kies het gebouw —</option>${d.g.map(g=>`<option value="${esc(g[0])}" ${m.gebouwId===g[0]?"selected":""}>${esc(g[1])}</option>`).join("")}</select></div>
      <div class="rij"><div style="flex:1"><label class="lbl" for="c-dat">Datum</label><input type="date" id="c-dat" value="${esc(m.datum)}"></div>
        <div style="flex:1.3"><label class="lbl" for="c-door">Wie meet?</label><input type="text" id="c-door" list="dl-cn" value="${esc(m.door)}" placeholder="je naam" autocomplete="off"><datalist id="dl-cn">${(d.n||[]).map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div></div></div>
    ${!m.gebouwId ? `<div class="kaart leeg uitleg">Kies eerst het gebouw. De bouwdelen volgen het gebouwtype uit projectopvolging.</div>` : `
    <div class="kaart"><div class="c-voortgang"><b id="c-tel">${t.b}/${t.n} bouwdelen bekeken</b><span id="c-tel2">${t.g} gebrek${t.g===1?"":"en"} · ${t.f} foto${t.f===1?"":"'s"}</span></div><div class="c-balk"><i id="c-balk" style="width:${t.n?Math.round(t.b/t.n*100):0}%"></i></div></div>
    <div id="c-groepen">${cGroepen(m).map(g=>cGroepHtml(m, g)).join("")}</div>
    <div class="kaart"><label class="lbl" for="c-opm">Algemene opmerking</label><textarea id="c-opm" placeholder="bv. algemene indruk van het gebouw">${esc(m.opmerking)}</textarea></div>
    <button class="mini weg" id="cWeg" style="align-self:center">deze meting van de gsm verwijderen</button>`}`;
  $("#c-geb").onchange = async e=>{ const g = cGeb(e.target.value); m.gebouwId = g ? g[0] : ""; m.gebouw = g ? g[1] : "";
    m.deelIds = m.gebouwId ? [...new Set([...cDelenVoorGebouw(m.gebouwId), ...Object.keys(m.delen).filter(id=>cKlaar(m.delen[id]) || (m.delen[id].fotos||[]).length)])] : [];
    m.verzonden = ""; await cBewaar(m); toon(); };
  $("#c-dat").onchange = async e=>{ m.datum = e.target.value || vandaag(); m.verzonden = ""; await cBewaar(m); kop(m.gebouw || "Nieuwe meting", dNL(m.datum), true); };
  $("#c-door").onchange = async e=>{ m.door = e.target.value.trim(); if(m.door) ls("rg-naam", ls("rg-naam") || m.door); await cBewaar(m); };
  if($("#c-opm")) $("#c-opm").onchange = async e=>{ m.opmerking = e.target.value; m.verzonden = ""; await cBewaar(m); cTellers(m); };
  cToggleKoppel();
  const gr = $("#c-groepen");
  if(gr) gr.onclick = async e=>{
    const k = e.target.closest("button[data-act]"); if(!k) return; const grp = k.closest(".c-groep"), gid = grp?.dataset.g, deel = k.closest(".c-deel"), did = deel?.dataset.d, act = k.dataset.act;
    const x = did ? (m.delen[did] = m.delen[did] || {}) : null;
    if(act==="foto" || act==="bib"){ cFotoDoel = {mid:m.id, did}; $(act==="foto" ? "#camera" : "#bib").click(); return; }   // meteen, zodat de iPhone de camera toelaat
    if(act==="gebrek" || act==="gb"){ cScroll = window.scrollY; cConcept = null; staat = {scherm:"cGebrek", mid:m.id, did, gbid:act==="gb" ? k.dataset.gb : null}; toon(); return; }
    if(act==="geen"){ if(x.score===1) delete x.score; else { x.score = 1; delete x.nvt; } }
    else if(act==="nvt"){ if(x.nvt) delete x.nvt; else { x.nvt = true; delete x.score; } }
    else if(act==="fw"){ (x.fotos||[]).splice(Number(k.dataset.j), 1); }
    else if(act==="rest"){ m.deelIds.filter(id=>cGroepVan(id)===gid && !cKlaar(m.delen[id])).forEach(id=>{ m.delen[id] = {...(m.delen[id]||{}), score:1}; }); }
    else return;
    m.verzonden = ""; cGroepVernieuw(m, gid); await cBewaar(m);
  };
  if($("#cWeg")) $("#cWeg").onclick = ()=>bevestig(m.verzonden ? "Deze meting is verzonden. Van de gsm verwijderen?" : "Deze meting is nog niet verzonden. Toch verwijderen? De foto's gaan verloren.", "Verwijderen", async ()=>{ metingen = metingen.filter(x=>x.id!==m.id); await cDbWeg(m.id); staat = {scherm:"cLijst"}; toon(); });
  onder(m.gebouwId ? `<button class="knop hoofd" id="cVerzend" ${t.b || (m.opmerking||"").trim() ? "" : "disabled"}>&#9993; Meting verzenden</button>` : "");
  if($("#cVerzend")) $("#cVerzend").onclick = ()=>{ if($("#c-opm")) m.opmerking = $("#c-opm").value; cVerzenden(m); };
}
async function cFotosErbij(files){
  const doel = cFotoDoel; cFotoDoel = null; const m = metingen.find(x=>x.id===doel.mid), l = [...(files||[])]; if(!m || !l.length) return;
  const x = m.delen[doel.did] = m.delen[doel.did] || {}; x.fotos = x.fotos||[];
  for(const f of l){ const b = await verklein(f); if(b) x.fotos.push(b); else melding("Een foto kon niet gelezen worden."); }
  m.verzonden = ""; await cBewaar(m);
  if(staat.scherm==="cGebrek") toon(); else if(staat.scherm==="cMeting") cGroepVernieuw(m, cGroepVan(doel.did));
}

/* --- een gebrek: ernst, intensiteit en omvang geven de score volgens de NEN-tabel uit projectopvolging --- */
function cSeg(id, opts, w){ return `<div class="seg c-seg" id="${id}">${opts.map(([v,t])=>`<button data-v="${v}" class="${String(w)===String(v)?"aan":""}">${t}</button>`).join("")}</div>`; }
function schermCGebrek(){
  const m = cHuidig(); if(!m){ staat = {scherm:"cLijst"}; return toon(); }
  const did = staat.did, x = m.delen[did] = m.delen[did] || {};
  if(!cConcept){ const g = staat.gbid ? (x.gebreken||[]).find(y=>y.id===staat.gbid) : null;
    cConcept = g ? JSON.parse(JSON.stringify(g)) : {id:nieuwId(), gebrek:"", ernst:2, intensiteit:2, omvang:2, aspecten:[], urgentie:"5j", maatregel:"", kosten:"", jaar:cUrgJaar("5j")}; }
  const c = cConcept, nieuw = !staat.gbid, f = x.fotos||[];
  kop(nieuw ? "Nieuw gebrek" : "Gebrek aanpassen", cDeel(did)?.[1]||"", true);
  const score = () => { const s = cNen(c); return `${cBol(s)}<span><b>Score ${s||"?"}</b> ${C_LABEL[s]||""}</span>`; };
  $("#scherm").innerHTML = `<div class="kaart velden">
      <div><label class="lbl" for="g-n">Gebrek</label><input type="text" id="g-n" list="dl-gb" value="${esc(c.gebrek)}" placeholder="bv. Lekkage" autocomplete="off"><datalist id="dl-gb">${GEBREK_STD.map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>
      <div><label class="lbl">Ernst</label>${cSeg("g-e", [[1,"gering"],[2,"serieus"],[3,"ernstig"]], c.ernst)}</div>
      <div><label class="lbl">Intensiteit</label>${cSeg("g-i", [[1,"begin"],[2,"gevorderd"],[3,"eind"]], c.intensiteit)}</div>
      <div><label class="lbl">Omvang (deel van het bouwdeel)</label>${cSeg("g-o", [[1,"&lt;2%"],[2,"2–10"],[3,"10–30"],[4,"30–70"],[5,"&ge;70%"]], c.omvang)}</div>
      <div class="c-score" id="g-score">${score()}</div></div>
    <div class="kaart velden">
      <div><label class="lbl">Invloed op</label><div class="chips" id="g-a">${ASPECTEN.map(([k,t,i])=>`<button data-v="${k}" class="${(c.aspecten||[]).includes(k)?"aan":""}">${i} ${t}</button>`).join("")}</div></div>
      <div><label class="lbl">Urgentie</label>${cSeg("g-u", URGENTIE.map(u=>[u[0],u[1]]), c.urgentie)}</div>
      <div class="rij"><div style="flex:1.4"><label class="lbl" for="g-k">Raming (€)</label><input type="text" id="g-k" inputmode="numeric" value="${esc(c.kosten||"")}" placeholder="niet verplicht"></div>
        <div style="flex:1"><label class="lbl" for="g-j">Jaar</label><input type="text" id="g-j" inputmode="numeric" value="${esc(c.jaar||"")}"></div></div>
      <div><label class="lbl" for="g-m">Maatregel</label><textarea id="g-m" placeholder="wat moet er gebeuren?">${esc(c.maatregel||"")}</textarea></div></div>
    <div class="kaart velden"><label class="lbl">Foto's van dit bouwdeel</label>
      ${f.length ? `<div class="cl-fotos">${f.map(b=>`<div><img src="${fotoUrl(b)}" alt=""></div>`).join("")}</div>` : `<p class="uitleg">Nog geen foto.</p>`}
      <div class="fotoknop"><button class="knop blauw" id="g-neem">&#128247; Foto nemen</button><button class="knop licht" id="g-kies">Uit foto's</button></div></div>
    ${nieuw ? "" : `<button class="mini weg" id="g-weg" style="align-self:center">dit gebrek verwijderen</button>`}`;
  const lees = ()=>{ c.gebrek = $("#g-n").value.trim(); c.kosten = $("#g-k").value.replace(/[^\d]/g,""); c.jaar = $("#g-j").value.replace(/[^\d]/g,""); c.maatregel = $("#g-m").value; };
  const seg = (id, veld, getal, na) => { $(id).onclick = e=>{ const b = e.target.closest("button"); if(!b) return; c[veld] = getal ? Number(b.dataset.v) : b.dataset.v; $(id).querySelectorAll("button").forEach(z=>z.classList.toggle("aan", z===b)); $("#g-score").innerHTML = score(); if(na) na(); }; };
  seg("#g-e", "ernst", true); seg("#g-i", "intensiteit", true); seg("#g-o", "omvang", true);
  seg("#g-u", "urgentie", false, ()=>{ if(!c.jaarZelf){ c.jaar = cUrgJaar(c.urgentie); $("#g-j").value = c.jaar; } });
  $("#g-j").oninput = ()=>{ c.jaarZelf = true; };
  $("#g-a").onclick = e=>{ const b = e.target.closest("button"); if(!b) return; const k = b.dataset.v; c.aspecten = (c.aspecten||[]).includes(k) ? c.aspecten.filter(a=>a!==k) : [...(c.aspecten||[]), k]; b.classList.toggle("aan"); };
  $("#g-neem").onclick = ()=>{ lees(); cFotoDoel = {mid:m.id, did}; $("#camera").click(); };
  $("#g-kies").onclick = ()=>{ lees(); cFotoDoel = {mid:m.id, did}; $("#bib").click(); };
  const terug = () => { cConcept = null; staat = {scherm:"cMeting", mid:m.id}; cOpen.add(cGroepVan(did)); toon(); window.scrollTo(0, cScroll); };
  if($("#g-weg")) $("#g-weg").onclick = ()=>bevestig("Dit gebrek verwijderen?", "Verwijderen", async ()=>{ x.gebreken = (x.gebreken||[]).filter(y=>y.id!==c.id); if(!x.gebreken.length) delete x.gebreken; m.verzonden = ""; await cBewaar(m); terug(); });
  onder(`<button class="knop licht" id="g-annul" style="flex:1">Annuleren</button><button class="knop hoofd" id="g-bew" style="flex:2">Bewaren</button>`);
  $("#g-annul").onclick = terug;
  $("#g-bew").onclick = async ()=>{ lees(); if(!c.gebrek){ melding("Schrijf kort wat het gebrek is."); $("#g-n").focus(); return; }
    const n = {...c}; delete n.jaarZelf; n.kosten = Number(n.kosten)||""; n.jaar = Number(n.jaar)||"";
    x.gebreken = x.gebreken||[]; const i = x.gebreken.findIndex(y=>y.id===n.id); if(i<0) x.gebreken.push(n); else x.gebreken[i] = n;
    delete x.score; delete x.nvt; m.verzonden = ""; await cBewaar(m); terug(); melding("Bewaard op de gsm."); };
}

/* --- verzenden: één mail met een gegevensbestand en de foto's --- */
function cVerzenden(m){
  if(!m.gebouwId){ melding("Kies eerst het gebouw."); return; }
  if(!(m.door||"").trim()){ melding("Vul in wie meet."); $("#c-door")?.focus(); return; }
  const adres = cData()?.m || "", d = document.createElement("div"); d.className = "bevestig";
  d.innerHTML = `<div class="kaart"><p style="font-weight:700">Meting verzenden</p>
    <p class="uitleg">Kies in het volgende scherm je mail-app en stuur de mail naar${adres ? ":" : " de verantwoordelijke in projectopvolging."}</p>
    ${adres ? `<div class="c-adres"><b>${esc(adres)}</b><button class="knop licht" id="cpKopie">Kopiëren</button></div>` : ""}
    <button class="knop hoofd" id="cpGa">&#9993; Verzenden</button><button class="knop licht" id="cpNee">Annuleren</button></div>`;
  document.body.appendChild(d);
  if(adres) d.querySelector("#cpKopie").onclick = async ()=>{ try{ await navigator.clipboard.writeText(adres); melding("Adres gekopieerd."); }catch(e){ melding("Kopiëren lukte niet."); } };
  d.querySelector("#cpNee").onclick = ()=>d.remove(); d.onclick = e=>{ if(e.target===d) d.remove(); };
  d.querySelector("#cpGa").onclick = ()=>{ d.remove(); cDelen(m, adres); };
}
async function cDelen(m, adres){
  const basis = `conditie-${slug(m.gebouw)}-${m.datum}`, files = [], delen = {}, t = cTel(m), regels = [];
  (m.deelIds||[]).forEach(id=>{ const x = m.delen[id]; if(!x) return; const naam = cDeel(id)?.[1] || x.naam || id;
    const namen = (x.fotos||[]).map((f,j)=>`${basis}-${slug(id)}-${j+1}.jpg`); namen.forEach((n,j)=>files.push(new File([x.fotos[j]], n, {type:"image/jpeg"})));
    const uit = {naam};
    if(x.nvt) uit.nvt = true;
    else if((x.gebreken||[]).length){ uit.gebreken = x.gebreken.map(g=>{ const o = {id:g.id, gebrek:g.gebrek, ernst:g.ernst, intensiteit:g.intensiteit, omvang:g.omvang, aspecten:g.aspecten||[], urgentie:g.urgentie};
        if((g.maatregel||"").trim()) o.maatregel = g.maatregel.trim(); if(Number(g.kosten)) o.kosten = Number(g.kosten); if(Number(g.jaar)) o.jaar = Number(g.jaar);
        regels.push(`– ${naam}: ${g.gebrek} (score ${cNen(g)}, ${(URGENTIE.find(u=>u[0]===g.urgentie)||[])[1]||""})`); return o; }); }
    else if(x.score) uit.score = x.score;
    if(namen.length) uit.fotos = namen;
    if(Object.keys(uit).length>1) delen[id] = uit; });
  const data = {type:"conditie-meting", versie:1, gemaakt:new Date().toISOString(), door:m.door, gebouw:{id:m.gebouwId, naam:m.gebouw}, datum:m.datum, opmerking:(m.opmerking||"").trim(), deelIds:m.deelIds, delen};
  const json = new File([JSON.stringify(data, null, 1)], basis+".json", {type:"application/json"});
  const tekst = `${adres?`Aan: ${adres}\n\n`:""}Conditiemeting ${m.gebouw} – ${dNL(m.datum)} door ${m.door}\n${t.b}/${t.n} bouwdelen bekeken, ${t.g} gebrek${t.g===1?"":"en"}, ${files.length} foto${files.length===1?"":"'s"}.${regels.length?"\n\n"+regels.join("\n"):""}${data.opmerking?`\n\nOpmerking: ${data.opmerking}`:""}\n\nLees deze mail in in projectopvolging: Conditie → Inlezen uit de app.`;
  const alles = [json, ...files];
  try{
    if(navigator.canShare && navigator.canShare({files:alles})){ await navigator.share({files:alles, title:`Conditiemeting ${m.gebouw} ${dNL(m.datum)}`, text:tekst}); m.verzonden = vandaag(); await cBewaar(m); toon(); melding("Verzonden.", 3000); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const metFotos = {...data, fotosData:{}}; for(const f of files) metFotos.fotosData[f.name] = await new Promise(res=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.readAsDataURL(f); });
  const blob = new Blob([JSON.stringify(metFotos)], {type:"application/json"}), a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = basis+".json"; document.body.appendChild(a); a.click(); a.remove();
  m.verzonden = vandaag(); await cBewaar(m); toon(); melding(`Delen lukt niet in deze browser. Het bestand is gedownload: stuur het als bijlage${adres?" naar "+adres:""}.`, 6000);
}

$("#terug").onclick = ()=>{ const s = staat.scherm;
  if(s==="punt"){ concept = null; staat = {scherm:"rg", rid:staat.rid}; }
  else if(s==="cGebrek"){ cConcept = null; staat = {scherm:"cMeting", mid:staat.mid}; }
  else if(s==="cMeting") staat = {scherm:"cLijst"};
  else if(s==="rg") staat = {scherm:"lijst"};
  else staat = {scherm:"start"};
  toon(); };
$("#instelKnop").onclick = ()=>{ staat = {scherm:"instel"}; toon(); };
window.addEventListener("hashchange", ()=>{ leesLink(); staat = {scherm:"start"}; toon(); });
(async()=>{ leesLink(); db = await dbOpen(); lijst = await dbAlles(); metingen = await cDbAlles(); staat = {scherm:"start"}; toon(); })();
